AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable

plugins:
  - rubocop-rake
  - rubocop-rspec

Naming/FileName:
  Exclude:
    - 'lib/rubocop/buildout-rails.rb'

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*_spec.rb'

RSpec/ExampleLength:
  Max: 10
